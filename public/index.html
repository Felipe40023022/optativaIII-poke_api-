<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PokéAPI | Dashboard de Gestión</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <header class="navbar">
        <div class="logo">
            <span class="pokeball-icon"></span>
            <h1>PokéAPI <span>Dashboard</span></h1>
        </div>
        <button id="btn-open-modal" class="btn btn-primary">+ Nuevo Pokémon</button>
    </header>

    <main class="container">
        <section class="controls">
            <input type="text" id="search-input" placeholder="Buscar por nombre o ID..." class="input-search">
        </section>

        <section id="pokemon-grid" class="grid"></section>
    </main>

    <!-- Modal Formulario (Crear/Editar) -->
    <div id="modal" class="modal hidden">
        <div class="modal-content">
            <span id="btn-close-modal" class="close">&times;</span>
            <h2 id="modal-title">Registrar Pokémon</h2>
            
            <form id="pokemon-form">
                <input type="hidden" id="form-mode" value="create">
                
                <div class="form-group">
                    <label for="id">ID (Número Pokedex)</label>
                    <input type="number" id="id" required min="1">
                </div>

                <div class="form-group">
                    <label for="nombre">Nombre</label>
                    <input type="text" id="nombre" required>
                </div>

                <div class="form-group">
                    <label for="foto">URL de la Imagen</label>
                    <input type="url" id="foto" placeholder="https://..." required>
                </div>

                <div class="stats-grid">
                    <div class="form-group">
                        <label for="ps">PS</label>
                        <input type="number" id="ps" required min="1">
                    </div>
                    <div class="form-group">
                        <label for="ataque">Ataque</label>
                        <input type="number" id="ataque" required min="1">
                    </div>
                    <div class="form-group">
                        <label for="defensa">Defensa</label>
                        <input type="number" id="defensa" required min="1">
                    </div>
                    <div class="form-group">
                        <label for="ataque_especial">At. Esp.</label>
                        <input type="number" id="ataque_especial" required min="1">
                    </div>
                    <div class="form-group">
                        <label for="defensa_especial">Def. Esp.</label>
                        <input type="number" id="defensa_especial" required min="1">
                    </div>
                    <div class="form-group">
                        <label for="velocidad">Velocidad</label>
                        <input type="number" id="velocidad" required min="1">
                    </div>
                </div>

                <button type="submit" class="btn btn-block btn-primary" id="btn-submit">Guardar</button>
            </form>
        </div>
    </div>

    <!-- Modal de Carta Ampliada (Detalles y Poderes) -->
    <div id="detail-modal" class="modal hidden">
        <div class="detail-card">
            <span id="btn-close-detail" class="close">&times;</span>
            <div class="card-id" id="detail-id">#000</div>
            <h2 id="detail-nombre" class="detail-title">Nombre Pokémon</h2>
            <img id="detail-foto" src="" alt="" class="detail-img">
            
            <div id="detail-powers" class="powers-list">
                <!-- Las barras de poder se cargan dinámicamente -->
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
